[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pymccanalysis"
version = "1.0.0"
description = "Analysis of PTW Array and Water Tank data"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "James Murphy", email = "you@example.com" }
]
keywords = ["python"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

dependencies = [
    # "requests>=2.32",
    "matplotlib==3.10.9",
    "numpy==2.4.5",
    "pydicom>=2.4.5",
    "pylinac>=3.43.2",
    "pymedphys>=0.41.0",
    "scikit-image==0.26.0",
    "scipy==1.17.1",
    "types-pytz>=2022.1.1"
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.5",
    "mypy>=1.10",
]

[project.urls]
Homepage = "https://https://github.com/bobred/pymccanalysis"
Repository = "https://https://github.com/bobred/pymccanalysis"

[tool.setuptools]
package-dir = { "" = "pymccanalysis" }

[tool.hatch.build.targets.wheel]
packages = ["pymccanalysis"]
exclude = ['pymccanalysis/examples/**']

[tool.hatch.build.targets.sdist]
packages = ["pymccanalysis"]
exclude = ['pymccanalysis/examples/**']

[tool.setuptools.packages.find]
where = ["pymccanalysis"]

[tool.pytest.ini_options]
testpaths = []

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.mypy]
python_version = "3.10"
strict = true
